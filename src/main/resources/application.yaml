server:
  port: 8080
  threads:
    virtual:
      enabled: true
  # tomcat:
  #   connection-timeout: 5000
  #   max-connections: 10000
  #   accept-count: 1000
  #   threads:
  #     max: 200
  #     min-spare: 200
  #   keep-alive-timeout: -1
  #   max-keep-alive-requests: 4000
  #   uri-encoding: UTF-8
  # compression:
  #   enabled: true
  #   mime-types: application/json,text/html,text/xml,text/plain
  #   min-response-size: 1024

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:./db/test.db"
    hikari:
      maximum-pool-size: 1
      minimum-idle: 0
      connection-timeout: 3_000
      idle-timeout: 10_000
      max-lifetime: 30_000
      leak-detection-threshold: 3_000
      auto-commit: true

easy-query:
  database: sqlite
  name-conversion: underlined
  # 建议开启，便于调试时查看生成的SQL和映射警告
  print-sql: true 
  warning-column-miss: true 

logging:
  config: classpath:log4j2-spring.xml
  level:
    '[com.lmax]': trace
    '[com.zaxxer]': trace
    '[org.apache.logging]': trace
    '[com.example]': trace
